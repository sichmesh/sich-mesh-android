name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (the chunk code against the device's own chunks)
        run: bash ./gradlew --no-daemon testDebugUnitTest
      - name: APK (signed with the debug key - for testing only; the release key comes later)
        run: bash ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sich-mesh-apk
          path: app/build/outputs/apk/release/app-release.apk
